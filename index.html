<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Satya Prakash Yadav</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg viewBox="0 0 1280 720">
    <mask id="maskLeft">
      <rect x="-50%" width="100%" height="100%" fill="#fff" />
    </mask>
    <mask id="maskRight">
      <rect x="50%" width="100%" height="100%" fill="#fff" />
    </mask>

    <g font-size="150">
      <g id="maskLeft" fill="#000" mask="url(#maskLeft)" class="left">
        <text y="120">SATYA</text>
        <text y="250">PRAKASH</text>
        <text y="380">YADAV</text>
      </g>
      <g id="maskRight" fill="#aaa" mask="url(#maskRight)" class="right">
        <text y="120">SATYA</text>
        <text y="250">PRAKASH</text>
        <text y="380">YADAV</text>
      </g>
    </g>
  </svg>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
