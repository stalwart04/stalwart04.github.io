<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Satya Prakash Yadav</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
      width: 100%;
      height: 100%;
      font-family: 'Montserrat', sans-serif;
    }

    svg {
      width: 100%;
      height: 100vh;
      display: block;
    }

    text {
      dominant-baseline: middle;
      text-anchor: start; /* Align text to the left */
    }
  </style>
</head>
<body>

  <svg viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet">
    <mask id="maskLeft">
      <rect x="-50%" y="0" width="100%" height="100%" fill="#fff" />
    </mask>
    <mask id="maskRight">
      <rect x="50%" y="0" width="100%" height="100%" fill="#fff" />
    </mask>

    <g font-size="80" font-weight="900">
      <g mask="url(#maskLeft)" fill="#000" class="left">
        <text x="100" y="240">SATYA</text>
        <text x="100" y="360">PRAKASH</text>
        <text x="100" y="480">YADAV</text>
      </g>
      <g mask="url(#maskRight)" fill="#aaa" class="right">
        <text x="100" y="240">SATYA</text>
        <text x="100" y="360">PRAKASH</text>
        <text x="100" y="480">YADAV</text>
      </g>
    </g>
  </svg>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({
      defaults: {
        duration: 2,
        yoyo: true,
        ease: 'power2.inOut'
      }
    });

    tl.fromTo('.left, .right', {
      svgOrigin: '0 360',
      scaleX: (i) => [0.6, 0.85][i],
      x: -200
    }, {
      scaleX: (i) => [0.85, 0.6][i],
      x: 200
    }).play(0.5);

    const tl2 = gsap.timeline();
    document.querySelectorAll('text').forEach((t, i) => {
      tl2.add(
        gsap.fromTo(t, {
          xPercent: -100,
          x: 700
        }, {
          duration: 1,
          xPercent: 0,
          x: 100,
          ease: 'sine.inOut'
        }), i * 0.2
      );
    });

    window.onpointermove = (e) => {
      tl2.pause();
      gsap.to([tl, tl2], {
        duration: 2,
        ease: 'power4',
        progress: e.x / window.innerWidth
      });
    };
  </script>
</body>
</html>
